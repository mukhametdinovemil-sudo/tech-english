<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Тех. английский</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-512.png">
<link rel="icon" href="img/emblem.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="home" class="screen">
  <header class="top">
    <img class="emblem" src="img/emblem.svg" alt="Эмблема ФТТ">
    <div>
      <h1>Технический английский</h1>
      <p class="sub">15 минут в день</p>
    </div>
  </header>
  <section class="stats">
    <div class="stat"><span id="streak" class="big">0</span><span>дней подряд</span></div>
    <div class="stat"><span id="learned" class="big">0</span><span id="learned-of">выучено</span></div>
  </section>
  <div class="bar"><div id="bar-fill"></div></div>
  <button id="start" class="btn-main">Начать занятие<small id="start-info"></small></button>
  <button id="home-big" class="btn-second" hidden></button>
  <h2>Темы</h2>
  <ul id="topics" class="topics"></ul>
</main>

<main id="session" class="screen" hidden>
  <div class="session-top">
    <button id="quit" class="btn-icon" aria-label="Выйти">✕</button>
    <div class="bar small"><div id="sess-fill"></div></div>
    <span id="left" class="left"></span>
  </div>
  <div class="card">
    <div class="card-head">
      <span id="card-tag" class="tag"></span>
      <span id="card-new" class="badge" hidden>новое слово</span>
    </div>
    <div id="card-en" class="en"></div>
    <button id="say" class="btn-say">🔊 Послушать</button>
    <div id="card-ru" class="ru" hidden></div>
  </div>
  <div class="actions">
    <button id="show" class="btn-main">Показать перевод</button>
    <div id="grade" class="grade" hidden>
      <button id="no" class="btn-no">Не знал</button>
      <button id="yes" class="btn-yes">Знал</button>
    </div>
  </div>
</main>

<main id="quiz" class="screen" hidden>
  <div class="session-top">
    <button id="quiz-quit" class="btn-icon" aria-label="Выйти">✕</button>
    <div class="bar small"><div id="quiz-fill"></div></div>
    <span id="quiz-left" class="left"></span>
  </div>
  <p id="quiz-title" class="quiz-title"></p>
  <div class="card quiz-card">
    <span id="quiz-ask" class="tag"></span>
    <div id="quiz-word" class="en"></div>
    <button id="quiz-say" class="btn-say">🔊 Послушать</button>
  </div>
  <div id="quiz-options" class="options"></div>
  <form id="quiz-form" class="type-form" hidden>
    <input id="quiz-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Напиши по-английски">
    <button class="btn-main" type="submit">Проверить</button>
  </form>
  <div id="quiz-feedback" class="feedback" hidden></div>
  <button id="quiz-next" class="btn-main" hidden>Дальше</button>
</main>

<main id="done" class="screen" hidden>
  <div class="done-box">
    <div id="done-icon" class="done-icon">✓</div>
    <h2 id="done-title"></h2>
    <p id="done-text"></p>
    <button id="done-big" class="btn-main" hidden></button>
    <button id="home-btn" class="btn-second">На главную</button>
  </div>
</main>

<script src="js/words.js"></script>
<script src="js/srs.js"></script>
<script src="js/quiz.js"></script>
<script src="js/app.js"></script>
</body>
</html>
